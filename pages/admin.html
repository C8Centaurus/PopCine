<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <title>Taquilla - CineCatálogo</title>
    
    
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar Superior -->
    <header class="text-white">
        <nav class="navbar navbar-expand-lg px-5" >
            <div class="container-fluid">
                <img src="../img_admin/Logotipo_POPCINE_Cinematografico_3D.png" alt="logo" class="logo">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                    aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarScroll">
                    <ul class="navbar-nav mx-auto my-2 my-lg-0 navbar-nav-scroll">
                        <li class="nav-item">
                            <a class="nav-link active text-white link-danger" aria-current="page" href="#">Sala Principal / Cartelera</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-danger text-white" href="#">Experiencias VIP</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-danger text-white" href="#">Confiteria</a>
                        </li>

                    </ul>
                    <form class="d-flex" role="search">
                        <a href="#" class="btn btn-iniciar" type="submit">Cerrar Sección</a>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Borde decorativo estilo marquesina/toldo de cine -->
    <div class="cinema-border"></div>

    <!-- Contenido Principal -->
    <main class="container  my-5 rounded-4" >
        
        <!-- Encabezado y botones de acción -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h1 class="text-cine-red fw-bold fs-2 m-0">🍿 Mis películas</h1>
            <div class="d-flex gap-2">
                <button class="btn btn-cine rounded-pill px-4 fw-semibold">+ Agregar película</button>
            </div>
        </div>

        <!-- Barra de búsqueda y filtro -->
        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <input type="text" class="form-control form-control-lg rounded-3 border-secondary-subtle fs-6" placeholder="Busca por título">
            </div>
            <div class="col-md-4">
                <select class="form-select form-select-lg rounded-3 border-secondary-subtle fs-6">
                    <option selected>Todas</option>
                    <option value="cartelera">En cartelera</option>
                    <option value="proximamente">Próximamente</option>
                </select>
            </div>
        </div>

        <!-- Tabla de películas -->
        <div class="table-responsive rounded-4 shadow-sm">
            <table class="table table-borderless align-middle mb-0">
                <thead class="table-cine-header">
                    <tr>
                        <th class="py-3 ps-4">Póster</th>
                        <th class="py-3">Título</th>
                        <th class="py-3">Género</th>
                        <th class="py-3">Duración</th>
                        <th class="py-3">Edad</th>
                        <th class="py-3">Estado</th>
                        <th class="py-3 pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody class="bg-cine-cream">
                    <!---------------------------------------------------------- pelicula 1 -->
                    <tr class="border-bottom border-dark-subtle">
                        <td class="ps-4 py-3">
                            <div class="poster-placeholder bg-warning text-white d-flex align-items-center justify-content-center rounded-3 shadow-sm">
                                <img src="" alt="">
                            </div>
                        </td>
                        <td class="fw-bold titulo_peli">El Rey León</td>
                        <td class="text-white">Animación</td>
                        <td class="text-white">88 min</td>
                        <td class="text-white">Todo público</td>
                        <td>
                            <span class="badge rounded-pill badge-cartelera px-3 py-2">En cartelera</span>
                        </td>
                        <td class="pe-4">
                            <button class="btn btn-sm btn-editar  rounded-pill px-3 fw-semibold me-1">Editar</button>
                            <button class="btn btn-sm btn-cine rounded-pill px-3 fw-semibold">Eliminar</button>
                        </td>
                    </tr>

                    
                    

                    
                   
                </tbody>
            </table>
        </div>

    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
