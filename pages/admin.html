<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/admin.css">
    <title>Taquilla - CineCatálogo</title>
    
    
    
    
</head>
<body>

    <!-- Navbar Superior -->
    <header class="text-white">
        <nav class="navbar navbar-expand-lg px-5" >
            <div class="container-fluid">
                <img src="../img_admin/Logotipo_POPCINE_Cinematografico_3D.png" alt="logo" class="logo">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                    aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarScroll">
                    <ul class="navbar-nav mx-auto my-2 my-lg-0 navbar-nav-scroll">
                        <li class="nav-item">
                            <a class="nav-link active text-white link-danger" aria-current="page" href="#">Sala Principal / Cartelera</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-danger text-white" href="#">Experiencias VIP</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-danger text-white" href="#">Confiteria</a>
                        </li>

                    </ul>
                    <form class="d-flex" role="search">
                        <a href="../index.html" class="btn btn-iniciar" type="submit">Cerrar Sección</a>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Borde decorativo estilo marquesina/toldo de cine -->
    <div class="cinema-border"></div>

    <!-- Contenido Principal -->
    <main class="container  my-5 rounded-4" >
        
        <!-- Encabezado y botones de acción -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <h1 class="text-cine-red fw-bold fs-2 m-0">🍿 Mis películas</h1>
            <div class="d-flex gap-2">                
                <button type="button" class="btn btn-cine rounded-pill px-4 fw-semibold" data-bs-toggle="modal" data-bs-target="#exampleModal">
                    + Agregar película
                </button>
            </div>
        </div>

        <!-- Barra de búsqueda y filtro -->
        <div class="row g-3 mb-4">
            <div class="col-md-8">
                <input type="text" class="form-control form-control-lg rounded-3 border-secondary-subtle fs-6" placeholder="Busca por título">
            </div>
            <div class="col-md-4">
                <select class="form-select form-select-lg rounded-3 border-secondary-subtle fs-6">
                    <option selected>Todas</option>
                    <option value="cartelera">En cartelera</option>
                    <option value="proximamente">Próximamente</option>
                </select>
            </div>
        </div>

        <!-- Tabla de películas -->
        <div class="table-responsive rounded-4 shadow-sm">
            <table class="table table-borderless align-middle mb-0">
                <thead class="table-cine-header">
                    <tr>
                        <th class="py-3 ps-4"scope="col">Póster</th>
                        <th class="py-3"scope="col">Título</th>
                        <th class="py-3"scope="col">Género</th>
                        <th class="py-3"scope="col">Duración</th>
                        <th class="py-3"scope="col">Horario</th>
                        <th class="py-3"scope="col">Estado</th>
                        <th class="py-3 pe-4"scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody class="bg-cine-cream"><!---------------------------- peliculas ----------->              

                </tbody>
            </table>
        </div>

    </main>
<!---------------------------------------------- footer ------------------------>
    <footer>

    </footer>

<!--------------------------------------- modal ---------------------------------------->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content  text-white rounded-3 border-secondary">
      <div class="modal-header bg-black border-secondary">
        <h1 class="modal-title fs-5 text-rosa fw-bold" id="exampleModalLabel">🍿 Datos</h1>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="formPelicula">
        <div class="modal-body">
          <!-- Campo para guardar el ID al editar -->
          <input type="hidden" id="peliculaId">

          <!-- Título -->
          <div class="mb-3">
            <label for="titulo" class="form-label text-danger fw-semibold">Título</label>
            <input type="text" class="form-control border-secondary" id="titulo" placeholder="Ej: El Rey León" required>
          </div>

          <!-- Póster (URL de la imagen) -->
          <div class="mb-3">
            <label for="poster" class="form-label text-danger fw-semibold">URL del Póster</label>
            <input type="url" class="form-control border-secondary" id="poster" placeholder="https://ejemplo.com/poster.jpg" required>
          </div>

          <!-- Fila para Género y Duración -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="genero" class="form-label text-danger fw-semibold">Género</label>
              <select class="form-select border-secondary" id="genero" required>
                <option value="" selected disabled>Selecciona...</option>
                <option value="Animación">Animación</option>
                <option value="Acción">Acción</option>
                <option value="Aventura">Aventura</option>
                <option value="Comedia">Comedia</option>
                <option value="Drama">Drama</option>
                <option value="Terror">Terror</option>
                <option value="Ciencia Ficción">Ciencia Ficción</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label for="duracion" class="form-label text-danger fw-semibold">Duración</label>
              <input type="text" class="form-control border-secondary" id="duracion" placeholder="Ej: 88 min" required>
            </div>
          </div>

          <!-- Fila para Horario y Estado -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="horario" class="form-label text-danger fw-semibold">Horario</label>
              <input type="text" class="form-control border-secondary" id="horario" placeholder="Ej: 20:00" required>
            </div>

            <div class="col-md-6 mb-3">
              <label for="estado" class="form-label text-danger fw-semibold">Estado</label>
              <select class="form-select border-secondary" id="estado" required>
                <option value="En cartelera">En cartelera</option>
                <option value="Próximamente">Próximamente</option>
              </select>
            </div>
          </div>

          <hr class="border-secondary">

          <!-- Fila para Sala y Precio -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="sala" class="form-label text-danger fw-semibold">Sala</label>
              <select class="form-select border-secondary" id="sala" required>
                <option value="sala1">Sala 1</option>
                <option value="sala2">Sala 2</option>
                <option value="sala3">Sala 3</option>
                <option value="sala4">Sala 4</option>
                <option value="sala5">Sala 5</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label for="precio" class="form-label text-danger fw-semibold">Precio</label>
              <input type="text" class="form-control border-secondary" id="precio" placeholder="Ej: 1000" required>
            </div>
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="modal-footer border-secondary bg-black">
          <button type="button" class="btn btn-secondary mx-2" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-iniciar fw-bold px-4" id="btnGuardar">Guardar 🍿</button>
        </div>
      </form>
    </div>
  </div>
</div>
<!----------------------------------------------------------------  fin modal  ------------------->



    <!----------------------------------------------------------- scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/Api.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
